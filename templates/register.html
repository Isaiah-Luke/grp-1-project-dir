<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>

<h2>Register</h2>

<form>
    <label>Username</label>
    <input id="username" type="text" placeholder="Enter username" required><br><br>

    <label>Email</label>
    <input id="email" type="email" placeholder="Enter email" required><br><br>

    <label>Password</label>
    <input id="password" type="password" placeholder="Create password" required><br><br>

    <label>Confirm Password</label>
    <input id="confirm" type="password" placeholder="Confirm password" required><br><br>

    <button type="button" onclick="registerUser()">Register</button>
</form>

<p>Already have an account? <a href="login.html">Login</a></p>

<script>
function registerUser() {
    var username = document.getElementById("username").value;
    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var confirm = document.getElementById("confirm").value;

    if(password !== confirm){
        alert("Passwords do not match!");
        return;
    }

    localStorage.setItem("username", username);
    localStorage.setItem("email", email);
    localStorage.setItem("password", password);

    alert("Registration successful!");

    window.location.href = "login.html";
}
</script>

</body>
</html>
